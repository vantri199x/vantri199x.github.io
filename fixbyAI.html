<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài sửa chữa bằng AI</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <main class="py-4">
            <div class="container">
                <!-- HÀNG CHÍNH: Chia đôi màn hình thành Menu trái và Nội dung phải -->
                <div class="row g-4">
                    
                    <!-- MENU BÊN TRÁI (Chiếm 4 phần) -->
                    <div class="col-md-4">
                        <div class="bg-dark text-white p-3 rounded">
                            <h1 class="my-4 ps-2">Logo</h1>
                            <div class="list-group">
                                <button type="button" class="list-group-item list-group-item-action">Dashboard</button>
                                <button type="button" class="list-group-item list-group-item-action">Age</button>
                                <button type="button" class="list-group-item list-group-item-action">Gender</button>
                                <button type="button" class="list-group-item list-group-item-action">Geo</button>
                            </div>
                        </div>
                    </div>

                    <!-- KHU VỰC NỘI DUNG BÊN PHẢI (Chiếm 8 phần) -->
                    <div class="col-md-8">
                        <div class="bg-dark text-white p-4 rounded h-100">
                            
                            <!-- Phần 1: Khối chữ Dashboard ở trên cùng bên phải -->
                            <div class="mb-4">
                                <h3 class="mb-1">Dashboard</h3>
                                <p class="text-secondary mb-0">Some text...</p>
                            </div>

                            <!-- Phần 2: Hàng ngang chứa 4 ô số liệu nằm NGAY DƯỚI Dashboard -->
                            <div class="row g-2">
                                <!-- Ô 1: User -->
                                <div class="col-3">
                                    <div class="p-3 bg-secondary text-white text-center rounded">
                                        <h5 class="fw-bold mb-1">User</h5>
                                        <small class="text-light">1 million</small>
                                    </div>
                                </div>
                                <!-- Ô 2: Page -->
                                <div class="col-3">
                                    <div class="p-3 bg-secondary text-white text-center rounded">
                                        <h5 class="fw-bold mb-1">Page</h5>
                                        <small class="text-light">100 million</small>
                                    </div>
                                </div>
                                <!-- Ô 3: Session -->
                                <div class="col-3">
                                    <div class="p-3 bg-secondary text-white text-center rounded">
                                        <h5 class="fw-bold mb-1">Session</h5>
                                        <small class="text-light">10 million</small>
                                    </div>
                                </div>
                                <!-- Ô 4: Bounce -->
                                <div class="col-3">
                                    <div class="p-3 bg-secondary text-white text-center rounded">
                                        <h5 class="fw-bold mb-1">Bounce</h5>
                                        <small class="text-light">30%</small>
                                    </div>
                                </div>
                            </div> <!-- Hết hàng 4 ô -->

                        </div>
                    </div> <!-- Hết khu vực bên phải -->

                </div>
            </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
