<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài thực hành số 3 - Chương 2</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
        </header>
        <main>
            <div class="container py-4">

    <h1 class="text-center mb-4">
        Bài 2.3: Căn chỉnh hình ảnh theo mẫu
    </h1>

    <h5>1. Left alignment (mặc định)</h5>

    <img
        src="https://www.w3schools.com/bootstrap5/img_avatar1.png"
        alt="Hình ảnh"
        width="150"
        class="d-block mb-4">

    <h5>2. Center alignment using text alignment classes</h5>

    <div class="text-center mb-4">
        <img
            src="https://www.w3schools.com/bootstrap5/img_avatar1.png"
            alt="Hình ảnh"
            width="150">
    </div>

    <h5>3. Right alignment using text alignment classes</h5>

    <div class="text-end mb-4">
        <img
            src="https://www.w3schools.com/bootstrap5/img_avatar1.png"
            alt="Hình ảnh"
            width="150">
    </div>

    <h5>4. Horizontal alignment using float classes</h5>

    <div class="clearfix mb-5">
        <img
            src="https://www.w3schools.com/bootstrap5/img_avatar1.png"
            alt="Hình ảnh"
            width="150"
            class="float-start">
    </div>
    <h5>5. Center alignment of block-level image using auto margin</h5>

    <img
        src="https://www.w3schools.com/bootstrap5/img_avatar1.png"
        alt="Hình ảnh"
        width="150"
        class="d-block mx-auto">

</div>
        </main>
        <footer>
        </footer>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
