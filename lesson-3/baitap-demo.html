<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Hiệu ứng hover bản đồ và cờ Việt Nam</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <style>
        /* Hiệu ứng hover tùy chỉnh kết hợp với Bootstrap 5 */
        .hover-effect {
            transition: all 0.4s ease-in-out;
        }
        .hover-effect:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.175) !important;
        }
    </style>
</head>

<body>
    <header>
        <!-- place navbar here -->
    </header>
    <main>
        <div class="container">
            <h2 class="text-center mb-5 fw-bold text-danger">HIỆU ỨNG HOVER CỜ & BẢN ĐỒ VIỆT NAM (BOOTSTRAP 5)</h2>

            <div class="row g-4 justify-content-center">

                <!-- Lá cờ Việt Nam -->
                <div class="col-md-5">
                    <div class="card border-0 shadow-sm hover-effect h-100 text-center p-3">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <h4 class="card-title mb-3 fw-bold text-dark">Quốc kỳ Việt Nam</h4>
                            <!-- Mô phỏng lá cờ bằng HTML/CSS hoặc ảnh SVG/PNG -->
                            <div class="position-relative bg-danger d-flex align-items-center justify-content-center rounded shadow"
                                style="width: 240px; height: 160px;">
                                <!-- Ngôi sao vàng (dùng ký tự Unicode hoặc SVG) -->
                                <span class="text-warning" style="font-size: 80px; line-height: 1;">★</span>
                            </div>
                            <p class="card-text text-muted mt-3">Rê chuột vào để xem hiệu ứng nổi và phóng to nhẹ.</p>
                        </div>
                    </div>
                </div>
                
                <!-- Bản đồ Việt Nam -->
                <div class="col-md-5">
                    <div class="card border-0 shadow-sm hover-effect h-100 text-center p-3">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <h4 class="card-title mb-3 fw-bold text-dark">Bản đồ Việt Nam</h4>
                            <!-- Khung chứa hình ảnh bản đồ -->
                            <div class="overflow-hidden rounded" style="width: 160px; height: 220px;">
                                <img src="https://vi.pngtree.com/freepng/map-of-vietnam-filled-with-flag-shape_13045715.html" alt="Bản đồ Việt Nam" class="img-fluid hover-effect">
                            </div>
                            <p class="card-text text-muted mt-3">Rê chuột vào khung bản đồ để trải nghiệm tương tác.</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net"></script>
</body>

</html>
