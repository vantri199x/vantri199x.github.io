<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <div class="container py-5">
                <div class="row">
                    <div class = "col md-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Button trong Bootstrap</h5>
                                <p class="card-text">Các loại button trong Bootstrap</p>
                                <button type="button" class="btn btn-primary mt-2">Primary</button><br>
                                <button type="button" class="btn btn-secondary mt-2">Secondary</button><br>
                                <button type="button" class="btn btn-success mt-2">Success</button><br>
                                <button type="button" class="btn btn-danger mt-2">Danger</button><br>
                                <button type="button" class="btn btn-warning mt-2">Warning</button><br>
                                <button type="button" class="btn btn-info mt-2">Info</button><br>
                                <button type="button" class="btn btn-light mt-2">Light</button><br>
                                <button type="button" class="btn btn-dark mt-2">Dark</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Thành phần của button</h5>
                                <p class="card-text">Các thành phần chính của button trong Bootstrap bao gồm: container, content, và các thuộc tính như màu sắc, kích thước, và trạng thái.</p>
                                <a href="#" class="btn btn-primary mt-2">Button chứa link</a>
                                <button type="button" class="btn btn-primary mt-2">Button</button>
                                <button type="button" class="btn btn-primary mt-2" disabled>Button bị vô hiệu hóa</button>
                                <button type="button" class="btn btn-primary mt-2" aria-disabled="true">Button bị vô hiệu hóa (aria-disabled)</button>
                                <button type="submit" class="btn btn-primary mt-2" >Button Submit</button>
                                <button type="input" class="btn btn-primary mt-2" >Button Input</button>
                                <button type="reset" class="btn btn-primary mt-2" >Button Reset</button>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
