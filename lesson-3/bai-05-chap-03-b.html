<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Bài thực hành số 05b - Chương 03</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body style="background-color: #99FF66">
    <header>
        <!-- place navbar here -->
    </header>
    <main>
        <div class="container mt-5">
            <h1 class="text-success text-center"><i class="fa-solid fa-clover" style="color: #0c6006;"></i> Registration
                Form</h1>
            <form>
                <!-- First Name -->
                <div class="row mb-3">
                    <label class="col-md-3 col-form-label text-success"> First Name: </label>

                    <div class="col-md-9">
                        <input type="text" style="background-color: #FFFFCC;" class="form-control"
                            placeholder="Enter your first name" />
                    </div>
                </div>

                <!-- Last Name -->
                <div class="row mb-3">
                    <label class="col-md-3 col-form-label text-success"> Last Name: </label>

                    <div class="col-md-9">
                        <input type="text" class="form-control" style="background-color: #FFFFCC;"
                            placeholder="Enter your last name" />
                    </div>
                </div>

                <!-- Email -->
                <div class="row mb-3">
                    <label class="col-md-3 col-form-label text-success"> Email Address: </label>

                    <div class="col-md-9">
                        <input type="email" style="background-color: #FFFFCC;" class="form-control"
                            placeholder="Email Address" />
                    </div>
                </div>

                <!-- Mobile -->
                <div class="row mb-3">
                    <label class="col-md-3 col-form-label text-success"> Mobile Number: </label>

                    <div class="col-md-9">
                        <input type="tel" style="background-color: #FFFFCC;" class="form-control"
                            placeholder="Phone Number" />
                    </div>
                </div>

                <!-- Date of Birth -->
                <div class="row mb-3">
                    <label class="col-md-3 col-form-label text-success"> Date of Birth: </label>

                    <div class="col-md-3 text-success">
                        <select class="form-select" style="background-color: #FFFFCC;">
                            <option selected>Date</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                        </select>
                    </div>

                    <div class="col-md-3 text-success">
                        <select class="form-select" style="background-color: #FFFFCC;">
                            <option selected>Month</option>
                            <option>January</option>
                            <option>February</option>
                            <option>March</option>
                            <option>April</option>
                            <option>May</option>
                        </select>
                    </div>

                    <div class="col-md-3 text-success">
                        <select class="form-select" style="background-color: #FFFFCC;">
                            <option selected>Year</option>
                            <option>2000</option>
                            <option>2001</option>
                            <option>2002</option>
                            <option>2003</option>
                            <option>2004</option>
                            <option>2005</option>
                        </select>
                    </div>
                </div>

                <!-- Postal Address -->
                <div class="row mb-3 text-success">
                    <label class="col-md-3 col-form-label"> Postal Address: </label>

                    <div class="col-md-9">
                        <textarea class="form-control" style="background-color: #FFFFCC;" rows="3"
                            placeholder="Postal Address"></textarea>
                    </div>
                </div>

                <!-- Zip Code -->
                <div class="row mb-3 text-success">
                    <label class="col-md-3 col-form-label"> Zip Code: </label>

                    <div class="col-md-9">
                        <input type="text" style="background-color: #FFFFCC;" class="form-control"
                            placeholder="Zip Code" />
                    </div>
                </div>

                <!-- Upload Image -->
                <div class="row mb-3">
                    <label class="col-md-3 col-form-label text-success"> Upload Image: </label>

                    <div class="col-md-9">
                        <input type="file" class="form-control" style="background-color: #FFFFCC;" />
                    </div>
                </div>

                <!-- Gender -->
                <div class="row mb-3">
                    <label class="col-md-3 col-form-label text-success"> Gender: </label>

                    <div class="col-md-9">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="male" />

                            <label class="form-check-label" style="color: dodgerblue;" for="male"><i
                                    class="fa-solid fa-mars"></i></label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="female" />

                            <label class="form-check-label" style="color: fuchsia;" for="female"><i
                                    class="fa-solid fa-venus"></i></label>
                        </div>
                    </div>
                </div>

                <!-- Terms -->
                <div class="row mb-3">
                    <div class="offset-md-3 col-md-9">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="terms" />

                            <label class="form-check-label" for="terms">
                                I agree to the
                                <a href="#"> Terms and Conditions </a>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="row">
                    <div class="offset-md-3 col-md-9">
                        <button type="submit" class="btn btn-success me-2 ">Submit</button>
                        <button type="reset" class="btn btn-danger">Reset</button>
                    </div>
                </div>
            </form>
        </div>
    </main>
    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
