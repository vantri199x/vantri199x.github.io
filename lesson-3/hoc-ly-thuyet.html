<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài mẫu trang 49 </title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <form action="" method="post" class="container py-5 border border-success rounded-3 mt-5" style="max-width: 400px; background-color: #FFFDE7;">
            <h3 class="text-center mb-4 text-success"><i class="fa-solid fa-seedling"></i>Đăng nhập tài khoản</h3>
            <div class="mb-3">
                <label for="" class="form-label">Email:</label>
                <input
                    type="email"
                    class="form-control text-secondary border border-success"
                    style="background-color: #CCFF99;"
                    name=""
                    id=""
                    aria-describedby="helpId"
                    placeholder="Nhập email của bạn"
                />
                <div class="mb-3">
                    <label for="" class="form-label">Password:</label>
                    <input
                        type="password"
                        class="form-control text-secondary border border-success"
                        style="background-color: #CCFF99;"
                        name=""
                        id=""
                        placeholder="Nhập mật khẩu của bạn"
                    />
                </div>
                <div class="form-check">
                    <label class="form-check-label" for=""> Lưu mật khẩu </label>
                    <input
                        type="checkbox"
                        class="form-check-input border border-success"
                        style="background-color: #FFFDE7;"
                        name=""
                        id=""
                    />
                </div>               
                <button
                    type="submit"
                    class="btn btn-success mt-3"
                >
                    Đăng nhập
                </button>
                
            </div>
            </form>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
